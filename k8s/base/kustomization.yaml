apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudlab
resources:
  - namespace.yaml
  - api.yaml
  - web.yaml
  - redis.yaml
  - pdb.yaml
configMapGenerator:
  - name: cloudlab-config
    literals:
      - APP_TITLE=班级云留言板
      - APP_VERSION=1.0.0
      - REDIS_HOST=redis
      - REDIS_PREFIX=cloudlab
  - name: cloudlab-nginx
    files:
      - default.conf=nginx.conf
generatorOptions:
  disableNameSuffixHash: true
