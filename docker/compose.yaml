name: cloudlab
services:
  api:
    image: cloudlab-api:1.0
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run bash scripts/lab.sh configure first}
      APP_TITLE: ${APP_TITLE:-班级云留言板}
      APP_VERSION: "1.0.0"
      REDIS_PREFIX: ${REDIS_PREFIX:-cloudlab}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    cpus: "0.5"
    mem_limit: 256m
    mem_reservation: 128m
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  web:
    image: cloudlab-web:1.0
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    ports: ["127.0.0.1:${LAB_COMPOSE_PORT:-8090}:80"]
    volumes: ["./nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3
    cpus: "0.2"
    mem_limit: 128m
    mem_reservation: 64m
  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run bash scripts/lab.sh configure first}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"']
    volumes: ["redis-data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 2s
      retries: 3
    cpus: "0.5"
    mem_limit: 512m
    mem_reservation: 128m
volumes:
  redis-data:
